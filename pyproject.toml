[project]
name = "langchain-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kasun Siriwardena", email = "kasun.siriwardena@hitachi-dps.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.38",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-agents = "langchain_agents:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
